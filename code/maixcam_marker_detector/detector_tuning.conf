# Field brightness diagnostics and freeze controls.
# Pass with: --detector-config detector_tuning.conf --debug-display

# First collect logs with both adaptive systems enabled.
use_auto_exposure=1
exposure_us=1500
use_fixed_led_threshold=0
fixed_led_threshold=180

# Adaptive bright-region threshold candidates:
# max(Otsu, percentile-1, ROI mean+local contrast), then clamp to min/max.
bright_percentile=0.92
min_led_threshold=105
max_led_threshold=250
local_contrast_threshold=24
saturation_threshold=250
morphology_kernel=3

# After analysing a representative field log, freeze both systems like this:
# use_auto_exposure=0
# exposure_us=<recommended value>
# use_fixed_led_threshold=1
# fixed_led_threshold=<recommended value>
