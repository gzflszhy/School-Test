# Runtime overrides for conservative first real-chassis tracking.
# Pass with: ./maixcam_marker_detector --control-config lateral_control.conf

# Nominal GC4653 3.05 mm lens at 480x270. Replace after calibration.
focal_x_px=281.5
principal_x_px=240.0
marker_leg_m=0.050
min_marker_scale_px=12.0
min_distance_m=0.08
max_distance_m=3.00

# Optional small-feature consensus correction.
optional_refinement_enabled=1
optional_refinement_min_components=2
optional_residual_gate_scale=0.10
optional_consensus_gate_scale=0.05
optional_max_correction_scale=0.04
optional_correction_weight=0.35

# Alpha-beta filter and short detection-gap prediction.
filter_alpha=0.35
filter_beta=0.06
filter_min_dt_s=0.010
filter_max_dt_s=0.120
filter_reset_gap_s=0.250
max_prediction_age_s=0.100
innovation_gate_base_m=0.030
innovation_gate_distance_scale=0.15
max_relative_velocity_mps=1.50

# Conservative first real-chassis PI gains. Restore velocity feed-forward only
# after left/right direction, L1 stop and target-loss stop have been verified.
position_deadband_m=0.002
lateral_kp_per_s=2.50
lateral_ki_per_s2=0.50
max_integral_vy_mps=0.08
relative_velocity_gain=0.00
max_vy_mps=0.50
max_command_acceleration_mps2=0.50
nominal_update_period_s=0.040

# Bounded lateral reacquisition after the 100 ms prediction window expires.
search_enabled=1
search_speed_mps=0.08
search_first_leg_s=1.00
search_max_duration_s=8.00
search_velocity_direction_threshold_mps=0.02
